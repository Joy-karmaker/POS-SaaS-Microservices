name: pos-saas-microservices

services:
  postgres:
    image: postgres:16-alpine
    container_name: pos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_DATABASE} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks:
      - pos-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pos-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_HOST_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    networks:
      - pos-network

  redis:
    image: redis:7.4-alpine
    container_name: pos-redis
    ports:
      - "${REDIS_PORT}:6379"
    networks:
      - pos-network

  tenant-service:
    build:
      context: ./services/tenant-service-laravel
    container_name: tenant-service
    volumes:
      - ./services/tenant-service-laravel:/app
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_URL: http://localhost/tenant
      APP_KEY: ${TENANT_SERVICE_APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: cookie
      CACHE_STORE: ${CACHE_STORE}
      PHP_CLI_SERVER_WORKERS: 8
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      AUTH_JWT_ACCESS_TTL: ${AUTH_JWT_ACCESS_TTL}
      AUTH_JWT_REFRESH_TTL: ${AUTH_JWT_REFRESH_TTL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:8080}
      AUTH_SERVICE_CONNECT_TIMEOUT: ${AUTH_SERVICE_CONNECT_TIMEOUT:-3}
      AUTH_SERVICE_TIMEOUT: ${AUTH_SERVICE_TIMEOUT:-10}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_CONNECTION_TIMEOUT: ${RABBITMQ_CONNECTION_TIMEOUT}
      RABBITMQ_READ_WRITE_TIMEOUT: ${RABBITMQ_READ_WRITE_TIMEOUT}
      RABBITMQ_HEARTBEAT: ${RABBITMQ_HEARTBEAT}
      RABBITMQ_KEEPALIVE: ${RABBITMQ_KEEPALIVE}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_EXCHANGE_TYPE: ${RABBITMQ_EXCHANGE_TYPE}
      RABBITMQ_DLX: ${RABBITMQ_DLX}
      RABBITMQ_ROUTING_SHIFT_CLOSED: ${RABBITMQ_ROUTING_SHIFT_CLOSED}
      RABBITMQ_ROUTING_SHIFT_CLOSED_DLQ: ${RABBITMQ_ROUTING_SHIFT_CLOSED_DLQ}
      RABBITMQ_QUEUE_SHIFT_CLOSED_AUDIT: ${RABBITMQ_QUEUE_SHIFT_CLOSED_AUDIT}
      RABBITMQ_QUEUE_SHIFT_CLOSED_DLQ: ${RABBITMQ_QUEUE_SHIFT_CLOSED_DLQ}
      RABBITMQ_PUBLISH_FAIL_HARD: ${RABBITMQ_PUBLISH_FAIL_HARD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    expose:
      - "8080"
    networks:
      - pos-network

  auth-service:
    build:
      context: ./services/auth-service-laravel
    container_name: auth-service
    volumes:
      - ./services/auth-service-laravel:/app
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_URL: http://localhost/auth
      APP_KEY: ${AUTH_SERVICE_APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: cookie
      CACHE_STORE: ${CACHE_STORE}
      PHP_CLI_SERVER_WORKERS: 8
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      AUTH_JWT_ACCESS_TTL: ${AUTH_JWT_ACCESS_TTL}
      AUTH_JWT_REFRESH_TTL: ${AUTH_JWT_REFRESH_TTL}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_CONNECTION_TIMEOUT: ${RABBITMQ_CONNECTION_TIMEOUT}
      RABBITMQ_READ_WRITE_TIMEOUT: ${RABBITMQ_READ_WRITE_TIMEOUT}
      RABBITMQ_HEARTBEAT: ${RABBITMQ_HEARTBEAT}
      RABBITMQ_KEEPALIVE: ${RABBITMQ_KEEPALIVE}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE}
      RABBITMQ_EXCHANGE_TYPE: ${RABBITMQ_EXCHANGE_TYPE}
      RABBITMQ_DLX: ${RABBITMQ_DLX}
      RABBITMQ_ROUTING_SHIFT_CLOSED: ${RABBITMQ_ROUTING_SHIFT_CLOSED}
      RABBITMQ_ROUTING_SHIFT_CLOSED_DLQ: ${RABBITMQ_ROUTING_SHIFT_CLOSED_DLQ}
      RABBITMQ_QUEUE_SHIFT_CLOSED_AUDIT: ${RABBITMQ_QUEUE_SHIFT_CLOSED_AUDIT}
      RABBITMQ_QUEUE_SHIFT_CLOSED_DLQ: ${RABBITMQ_QUEUE_SHIFT_CLOSED_DLQ}
      RABBITMQ_PUBLISH_FAIL_HARD: ${RABBITMQ_PUBLISH_FAIL_HARD}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    expose:
      - "8080"
    networks:
      - pos-network

  catalog-service:
    build:
      context: ./services/catalog-service-node
      dockerfile: Dockerfile
    container_name: catalog-service
    volumes:
      - ./services/catalog-service-node:/app
      - /app/node_modules
    command: npm run start:dev
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=128
      PORT: 3000
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    expose:
      - "3000"
    networks:
      - pos-network

  cart-service:
    build:
      context: ./services/cart-service-node
      dockerfile: Dockerfile
    container_name: cart-service
    volumes:
      - ./services/cart-service-node:/app
      - /app/node_modules
    command: npm run start:dev
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=128
      PORT: 3000
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      CATALOG_SERVICE_URL: http://catalog-service:3000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    expose:
      - "3000"
    networks:
      - pos-network

  gateway:
    image: nginx:1.27-alpine
    container_name: api-gateway
    ports:
      - "${GATEWAY_PORT}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - auth-service
      - tenant-service
      - catalog-service
      - cart-service
    networks:
      - pos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: pos-frontend
    ports:
      - "${FRONTEND_PORT}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE: ${VITE_API_BASE}
      VITE_GATEWAY_PROXY_TARGET: ${VITE_GATEWAY_PROXY_TARGET}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - gateway
    networks:
      - pos-network

networks:
  pos-network:
    driver: bridge

volumes:
  postgres-data:
  frontend-node-modules:
